apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: my-first-app
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-first-app
      component: backend
  template:
    metadata:
      labels:
        app: my-first-app
        component: backend
    spec:
      containers:
        - name: backend
          image: my-first-app-backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: my-first-app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
